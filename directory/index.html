<title>Atlanta Comedy Directory</title>
<style id="dir-css">
/* Layout: masthead + sticky filter bar + responsive card grid; owner-only editor drawer */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --fg:#14231c; --muted:#56655d; --line:#d9ded5;
  --green:#0f3d2e; --gold:#b8891a; --gold-hi:#d6a92a; --on-green:#f4efdc;
  --clown:#d23a3a; --burlesque:#8a4fc7; --standup:#2f6fd6; --improv:#2e9d58; --sketch:#e0b400; --other:#8a948e;
  --display:"Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1712; --surface:#13221b; --fg:#e6ebe4; --muted:#9aa89f; --line:#24362d;
  --green:#163f30; --gold:#d6a92a; --gold-hi:#e8bf47; --on-green:#f4efdc; --other:#6f7a74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1712; --surface:#13221b; --fg:#e6ebe4; --muted:#9aa89f; --line:#24362d;
  --green:#163f30; --gold:#d6a92a; --gold-hi:#e8bf47; --on-green:#f4efdc; --other:#6f7a74; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
header.mast{background:var(--green);color:var(--on-green);padding-block:28px 22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.02;margin:6px 0 10px;text-wrap:balance;color:var(--on-green)}
h1 span{color:var(--gold-hi)}
.lede{max-width:62ch;margin:0;color:var(--on-green);opacity:.9}
.mast-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row label.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:4px;min-width:52px}
input[type=search],input[type=text],input[type=url],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.count{font-size:13px;color:var(--muted)}
main{padding-block:20px 48px}
.group{margin-bottom:30px}
.group h2{font-family:var(--display);font-size:22px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-size:17px;line-height:1.25;font-family:var(--display);font-weight:700}
.card h3 a{color:inherit;text-decoration:none;border-bottom:2px solid var(--gold)}
.card h3 a:hover{color:var(--gold)}
.where{font-size:13px;color:var(--muted)}
.note{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.area{font-size:11px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.area.otp{border-color:var(--gold);color:var(--gold)}
.own{display:flex;gap:8px;margin-top:6px}
.btn{font:inherit;font-size:13px;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.gold{background:var(--gold);color:#1b1404;border-color:var(--gold);font-weight:700}
.btn.link{border:none;background:none;padding:2px 0;text-decoration:underline;color:var(--muted)}
.empty{padding:24px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
section.suggest{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:10px}
section.suggest h2{font-family:var(--display);margin:0 0 6px;font-size:22px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.form .full{grid-column:1/-1}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.checks{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:400;color:var(--fg);font-size:14px}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin:10px 0 0}
.ownerbar{background:var(--gold);color:#1b1404}
.ownerbar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:8px;font-size:14px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
footer{border-top:1px solid var(--line);padding-block:18px 30px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

        if(owner&&dbApi){
          dbApi.collection("submissions").where("status","==","pending").onSnapshot(function(snap){
            state.pending=snap.docs.map(function(d){return {id:d.id,data:d.data()||{}}});
            var ids=state.pending.map(function(p){return p.data.submitter}).filter(Boolean);
            if(ids.length&&userApi.profiles){userApi.profiles(ids).then(function(ps){ids.forEach(function(id){if(ps&&ps[id]&&ps[id].name)state.names[id]=ps[id].name});render()}).catch(function(){render()})}else render();
          },function(){});
        }
        render();
      });
    }).catch(function(){});
  }
})();
</script>

</body></html>
