name: Sync sections from sheet

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Guide section titles from the Comedy Database sheet
        env:
          SECTIONS_CSV_URL: ${{ vars.SECTIONS_CSV_URL }}
        run: python3 sync_sections.py guide

      - name: Rebuild the Guide if the titles changed
        run: |
          if git diff --quiet -- sections.json && git ls-files --error-unmatch sections.json >/dev/null 2>&1; then
            echo "No changes to section titles."
          else
            python3 build.py
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sections.json index.html performers/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync Guide section titles from sheet"
            git push
          fi
