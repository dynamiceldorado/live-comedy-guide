<style>
/* Layout: one 680px newsletter column — dark-green theater-bill masthead, then cream "program" pages with ticket-stub listings */
:root{

  --ink:#0c2118;         /* body text, green-black */

  --gold:#b79c55;        /* poster gold — accents only */

  --on-green:#f3ecdc;
  --note-bg:#fff4dc; --note-bd:#d9a441; --note-ink:#6b4a10;
  --g-clown:#b5432f; --g-stand:#3d68a6; --g-impro:#4d8a4a; --g-sketch:#a67a14; --g-var:#7b4397;
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1712; --paper:#13241b; --ink:#efe8d6; --muted:#a3ad9f; --rule:#2b3b30; --green:#123d2c; --green-2:#1a4d38; --gold:#c9ae68; --gold-ink:#c9ae68;
  --on-green:#f3ecdc; --note-bg:#2a2210; --note-bd:#b88a2e; --note-ink:#f0d79c; --g-clown:#d9654f; --g-stand:#7097d0; --g-impro:#79b06f; --g-sketch:#d8aa46; --g-var:#b58ad6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1712; --paper:#13241b; --ink:#efe8d6; --muted:#a3ad9f; --rule:#2b3b30; --green:#123d2c; --green-2:#1a4d38;
  --gold:#c9ae68; --gold-ink:#c9ae68; --on-green:#f3ecdc; --note-bg:#2a2210; --note-bd:#b88a2e; --note-ink:#f0d79c; --g-clown:#d9654f; --g-stand:#7097d0; --g-impro:#79b06f; --g-sketch:#d8aa46; --g-var:#b58ad6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);padding-inline:16px;padding-block:24px 48px}
a{color:var(--green-2);text-decoration-color:var(--gold);text-underline-offset:3px;font-weight:600}

.toolbar{max-width:680px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.sheet{max-width:680px;margin:0 auto;background:var(--paper);box-shadow:0 1px 0 var(--rule),0 18px 40px -24px rgba(0,0,0,.35)}

/* masthead */
.mast{background:var(--green);color:var(--on-green);padding:36px 32px 28px;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,transparent 18px 26px)}
.mast img{width:150px;height:auto;display:block;margin-bottom:22px}

.issue{font:500 12px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 14px}

.content{padding:28px 32px 8px}

.meta{font:400 12.5px/1.55 var(--f-mono);color:var(--muted);margin:0 0 6px}
.meta a{font-weight:500}

.foot{background:var(--green);color:var(--on-green);padding:26px 32px 30px;font-size:14px;position:relative}
.foot::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,transparent 18px 26px)}

</style>
